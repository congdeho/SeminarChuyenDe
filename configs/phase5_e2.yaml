# E2: ImageNet-pretrained ResNet18 with the Phase 3 training schedule.
architecture: resnet18
seed: 42
image_size: 224
batch_size: 32
num_workers: 2
classifier_epochs: 8
finetune_epochs: 25
classifier_lr: 0.001
finetune_lr: 0.0001
weight_decay: 0.0001
early_stopping_patience: 5
scheduler_patience: 2
scheduler_factor: 0.5
pretrained_weights: IMAGENET1K_V1
use_class_weights: true
augmentation: true
